name: Validate church records

on:
  pull_request:
    paths:
      - "data/**"
      - "research/**"
      - "tools/**"
      - "site/**"
  push:
    branches-ignore: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install jsonschema
      - name: Validate records
        run: python3 tools/validate.py
      - name: Build site
        run: python3 tools/build.py --no-validate
